apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-platform
  namespace: blog-platform
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: blog.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blog-frontend
                port:
                  number: 80
